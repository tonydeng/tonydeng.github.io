<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1280" height="620" fill="#FBFCFE"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#1E3A5F">工具结果落盘后，按尺寸自适应返回（全量 / 截断 / 降级）</text>
  <g>
    <rect x="470" y="60" width="340" height="56" rx="12" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="640" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A5F">CallToolResult 落盘成功</text>
    <text x="640" y="106" text-anchor="middle" font-size="12" fill="#5A6E85">单个 text 块 · isError:false</text>
    <line x1="640" y1="116" x2="640" y2="158" stroke="#1E3A5F" stroke-width="2" marker-end="url(#ar3)"/>
    <polygon points="480,160 800,160 640,250 480,160" fill="#FFF7EC" stroke="#E8A33D" stroke-width="2"/>
    <text x="640" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4A12">字节数 ≤ 2048</text>
    <text x="640" y="226" text-anchor="middle" font-size="14" fill="#7A4A12">且能解析成 JSON？</text>
    <line x1="505" y1="218" x2="230" y2="296" stroke="#3E9B6F" stroke-width="2" marker-end="url(#arG)"/>
    <text x="330" y="272" font-size="13" font-weight="700" fill="#2E7D57">是 · 小结果</text>
    <line x1="640" y1="250" x2="640" y2="296" stroke="#2B9FC7" stroke-width="2" marker-end="url(#ar3)"/>
    <text x="652" y="278" font-size="13" font-weight="700" fill="#0F5E87">否 · 大结果</text>
    <line x1="775" y1="218" x2="1050" y2="296" stroke="#C0564F" stroke-width="2" marker-end="url(#arR)"/>
    <text x="940" y="272" font-size="13" font-weight="700" fill="#9A3E38">解析失败</text>
    <rect x="60" y="300" width="340" height="108" rx="12" fill="#F2FAF5" stroke="#3E9B6F" stroke-width="1.5"/>
    <text x="230" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D57">小结果</text>
    <text x="230" y="354" text-anchor="middle" font-size="13" fill="#33503F">preview = 全量原文</text>
    <text x="230" y="374" text-anchor="middle" font-size="12" fill="#4A7A66">模型直接作答，不用读文件</text>
    <text x="230" y="394" text-anchor="middle" font-size="12" fill="#6B8F7E">那次 1,943 字节即属此类</text>
    <rect x="470" y="300" width="340" height="108" rx="12" fill="#EFF7FB" stroke="#2B9FC7" stroke-width="1.5"/>
    <text x="640" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5E87">大结果</text>
    <text x="640" y="354" text-anchor="middle" font-size="13" fill="#2B6E92">按字节预算截断</text>
    <text x="640" y="374" text-anchor="middle" font-size="12" fill="#4A7A99">数组取前 1 条 ≈ 512 字节</text>
    <text x="640" y="394" text-anchor="middle" font-size="12" fill="#6B8F9E">has_more:true · next 按 file 局部取数</text>
    <rect x="880" y="300" width="340" height="108" rx="12" fill="#FBF4F3" stroke="#C0564F" stroke-width="1.5"/>
    <text x="1050" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3E38">解析失败</text>
    <text x="1050" y="354" text-anchor="middle" font-size="13" fill="#7A4A48">降级 text({N} chars)</text>
    <text x="1050" y="374" text-anchor="middle" font-size="12" fill="#5A4A48">口径 text.length</text>
    <text x="1050" y="394" text-anchor="middle" font-size="12" fill="#8A6A66">残留一处未修（第 7.3 节）</text>
  </g>
  <g>
    <text x="40" y="456" font-size="16" font-weight="700" fill="#1E3A5F">返回四元组：每一块都有出处</text>
    <rect x="40" y="470" width="280" height="120" rx="12" fill="#FFFFFF" stroke="#8FA6C0" stroke-width="1.5"/>
    <text x="60" y="500" font-size="15" font-weight="700" fill="#1E3A5F">shape</text>
    <text x="60" y="524" font-size="13" fill="#33503F">字段名 + 类型</text>
    <text x="60" y="546" font-size="12" fill="#5A6E85">消除探索性调用</text>
    <text x="60" y="572" font-size="12" fill="#8AA0B8">依据：MCP outputSchema</text>
    <rect x="340" y="470" width="280" height="120" rx="12" fill="#FFFFFF" stroke="#8FA6C0" stroke-width="1.5"/>
    <text x="360" y="500" font-size="15" font-weight="700" fill="#1E3A5F">preview</text>
    <text x="360" y="524" font-size="13" fill="#33503F">前 N 条真实数据</text>
    <text x="360" y="546" font-size="12" fill="#5A6E85">原样截取，不加工</text>
    <text x="360" y="572" font-size="12" fill="#8AA0B8">依据：Anthropic 示例带值</text>
    <rect x="640" y="470" width="280" height="120" rx="12" fill="#FFFFFF" stroke="#8FA6C0" stroke-width="1.5"/>
    <text x="660" y="500" font-size="15" font-weight="700" fill="#1E3A5F">total / has_more</text>
    <text x="660" y="524" font-size="13" fill="#33503F">分页信息</text>
    <text x="660" y="546" font-size="12" fill="#5A6E85">让模型判断是否拿全</text>
    <text x="660" y="572" font-size="12" fill="#8AA0B8">依据：截断须带结构化标记</text>
    <rect x="940" y="470" width="280" height="120" rx="12" fill="#FFFFFF" stroke="#8FA6C0" stroke-width="1.5"/>
    <text x="960" y="500" font-size="15" font-weight="700" fill="#1E3A5F">next</text>
    <text x="960" y="524" font-size="13" fill="#33503F">终止信号</text>
    <text x="960" y="546" font-size="12" fill="#5A6E85">消除重复调用</text>
    <text x="960" y="572" font-size="12" fill="#8AA0B8">依据：Anthropic 引导性指令</text>
  </g>
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1E3A5F"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3E9B6F"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C0564F"/></marker>
  </defs>
</svg>
