<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1280" height="620" fill="#FBFCFE"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#1E3A5F">改造前后：数据怎么流动</text>
  <g>
    <rect x="40" y="70" width="1200" height="214" rx="14" fill="#FBF4F3" stroke="#C0564F" stroke-width="1.5"/>
    <text x="60" y="98" font-size="16" font-weight="700" fill="#9A3E38">改造前：写文件环节约 20 秒</text>
    <rect x="40" y="120" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#C0564F" stroke-width="1.5"/>
    <text x="135" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#7A2E28">Agent opencode</text>
    <text x="135" y="172" text-anchor="middle" font-size="12" fill="#5A4A48">调远程 MCP 工具</text>
    <line x1="230" y1="155" x2="360" y2="155" stroke="#C0564F" stroke-width="2" marker-end="url(#arR)"/>
    <text x="295" y="116" text-anchor="middle" font-size="12" fill="#8A5A55">远程调用</text>
    <text x="295" y="132" text-anchor="middle" font-size="12" fill="#8A5A55">（秒级）</text>
    <rect x="360" y="120" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#C0564F" stroke-width="1.5"/>
    <text x="455" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#7A2E28">远程 MCP 服务</text>
    <text x="455" y="172" text-anchor="middle" font-size="12" fill="#5A4A48">返回结果</text>
    <line x1="550" y1="155" x2="680" y2="155" stroke="#C0564F" stroke-width="2" marker-end="url(#arR)"/>
    <text x="615" y="116" text-anchor="middle" font-size="12" fill="#8A5A55">结果进</text>
    <text x="615" y="132" text-anchor="middle" font-size="12" fill="#8A5A55">上下文</text>
    <rect x="680" y="120" width="190" height="70" rx="10" fill="#FDF1EF" stroke="#C0564F" stroke-width="1.5"/>
    <text x="775" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#7A2E28">模型逐 token 复述</text>
    <text x="775" y="172" text-anchor="middle" font-size="12" fill="#5A4A48">流式生成文件内容</text>
    <line x1="870" y1="155" x2="1000" y2="155" stroke="#C0564F" stroke-width="2" marker-end="url(#arR)"/>
    <text x="935" y="116" text-anchor="middle" font-size="12" fill="#8A5A55">多轮工具</text>
    <text x="935" y="132" text-anchor="middle" font-size="12" fill="#8A5A55">往返</text>
    <rect x="1000" y="120" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#C0564F" stroke-width="1.5"/>
    <text x="1120" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#7A2E28">写本地文件</text>
    <text x="1120" y="172" text-anchor="middle" font-size="12" fill="#5A4A48">10 条数据 ≈ 20 秒</text>
    <rect x="40" y="222" width="1200" height="48" rx="10" fill="#FDF1EF" stroke="#E5B3AE" stroke-width="1"/>
    <text x="60" y="240" font-size="13" fill="#7A4A48">瓶颈在"工具结果 → 文件"这一段</text>
    <text x="60" y="260" font-size="13" fill="#7A4A48">模型在 agent 循环里把数据再说一遍 · 数据留在上下文里（推高成本、干扰后续判断）</text>
  </g>
  <g>
    <rect x="40" y="330" width="1200" height="260" rx="14" fill="#EFF7FB" stroke="#2B9FC7" stroke-width="1.5"/>
    <text x="60" y="358" font-size="16" font-weight="700" fill="#0F5E87">改造后：远程耗时 + 不到 1 秒</text>
    <rect x="40" y="380" width="210" height="70" rx="10" fill="#FFFFFF" stroke="#2B9FC7" stroke-width="1.5"/>
    <text x="145" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5E87">Agent opencode</text>
    <text x="145" y="432" text-anchor="middle" font-size="12" fill="#4A7A99">只拿 file 路径 + 元信息</text>
    <line x1="250" y1="415" x2="390" y2="415" stroke="#2B9FC7" stroke-width="2" marker-end="url(#ar2)"/>
    <text x="320" y="372" text-anchor="middle" font-size="12" fill="#4A7A99">stdio</text>
    <text x="320" y="388" text-anchor="middle" font-size="12" fill="#4A7A99">JSON-RPC</text>
    <rect x="390" y="380" width="210" height="70" rx="10" fill="#E8F4FB" stroke="#2B9FC7" stroke-width="2"/>
    <text x="495" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5E87">mcp-proxy</text>
    <text x="495" y="432" text-anchor="middle" font-size="12" fill="#2B6E92">透传 + 原生 I/O 落盘</text>
    <line x1="495" y1="450" x2="495" y2="478" stroke="#2B9FC7" stroke-width="2" marker-end="url(#ar2)"/>
    <rect x="390" y="478" width="210" height="56" rx="10" fill="#FFFFFF" stroke="#2B9FC7" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="495" y="504" text-anchor="middle" font-size="14" font-weight="700" fill="#0F5E87">本地数据文件</text>
    <text x="495" y="524" text-anchor="middle" font-size="12" fill="#4A7A99">≤1MB 落盘 &lt; 100ms</text>
    <line x1="600" y1="415" x2="740" y2="415" stroke="#2B9FC7" stroke-width="2" marker-end="url(#ar2)"/>
    <text x="670" y="372" text-anchor="middle" font-size="12" fill="#4A7A99">Streamable HTTP</text>
    <text x="670" y="388" text-anchor="middle" font-size="12" fill="#4A7A99">失败回退 SSE</text>
    <rect x="740" y="380" width="210" height="70" rx="10" fill="#FFFFFF" stroke="#2B9FC7" stroke-width="1.5"/>
    <text x="845" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5E87">远程 MCP 服务</text>
    <text x="845" y="432" text-anchor="middle" font-size="12" fill="#4A7A99">结果由代理直接落盘</text>
    <line x1="950" y1="415" x2="1090" y2="415" stroke="#2B9FC7" stroke-width="2" marker-end="url(#ar2)"/>
    <text x="1020" y="372" text-anchor="middle" font-size="12" fill="#4A7A99">返回 file</text>
    <text x="1020" y="388" text-anchor="middle" font-size="12" fill="#4A7A99">+ shape + next</text>
    <rect x="1090" y="380" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#2B9FC7" stroke-width="1.5"/>
    <text x="1165" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5E87">模型直接作答</text>
    <text x="1165" y="432" text-anchor="middle" font-size="12" fill="#4A7A99">不经过模型上下文</text>
    <rect x="40" y="548" width="1200" height="36" rx="10" fill="#E3F4EC" stroke="#8FC7A9" stroke-width="1"/>
    <text x="60" y="571" font-size="13" fill="#2E6B4C">数据不再进上下文 · 工具结果由代理写盘 · 代理开销 p50 17ms / p95 27ms（直连 7ms / 18ms）</text>
  </g>
  <defs>
    <marker id="arR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C0564F"/></marker>
    <marker id="ar2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2B9FC7"/></marker>
  </defs>
</svg>
