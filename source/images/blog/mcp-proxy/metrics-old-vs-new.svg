    <text x="480" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#0F5E87">69.2%</text>
    <text x="480" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A5F">LLM 轮次</text>
    <text x="480" y="468" text-anchor="middle" font-size="12" fill="#5A6E85">13 → 4 轮</text>
    <rect x="640" y="142" width="140" height="278" rx="6" fill="#3E9B6F"/>
