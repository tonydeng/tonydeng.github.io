  <text x="110" y="264" text-anchor="end" font-size="12" fill="#8AA0B8">50%</text>
  <text x="110" y="344" text-anchor="end" font-size="12" fill="#8AA0B8">25%</text>
  <line x1="120" y1="420" x2="1120" y2="420" stroke="#1E3A5F" stroke-width="2"/>
