<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1280" height="760" fill="#FBFCFE"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#1E3A5F">mcp-proxy 代理边界</text>
  <g>
    <rect x="40" y="70" width="210" height="96" rx="12" fill="#FFFFFF" stroke="#8FA6C0" stroke-width="1.5"/>
    <text x="145" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">opencode</text>
    <text x="145" y="132" text-anchor="middle" font-size="13" fill="#5A6E85">MCP 客户端</text>
    <text x="145" y="152" text-anchor="middle" font-size="12" fill="#8AA0B8">mcp.&lt;name&gt; · type:local</text>
    <line x1="250" y1="118" x2="500" y2="118" stroke="#1E3A5F" stroke-width="2" marker-end="url(#ar)"/>
    <text x="375" y="106" text-anchor="middle" font-size="12" fill="#5A6E85">stdio · JSON-RPC</text>
    <text x="375" y="148" text-anchor="middle" font-size="12" fill="#5A6E85">StdioServerTransport</text>
    <rect x="520" y="70" width="240" height="96" rx="12" fill="#E8F4FB" stroke="#2B9FC7" stroke-width="2"/>
    <text x="640" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#0F5E87">mcp-proxy</text>
    <text x="640" y="132" text-anchor="middle" font-size="13" fill="#2B6E92">本地进程 · 代理层</text>
    <text x="640" y="152" text-anchor="middle" font-size="12" fill="#4A7A99">一个实例对一个上游</text>
    <line x1="760" y1="118" x2="990" y2="118" stroke="#1E3A5F" stroke-width="2" marker-end="url(#ar)"/>
    <text x="875" y="106" text-anchor="middle" font-size="12" fill="#5A6E85">Streamable HTTP</text>
    <text x="875" y="148" text-anchor="middle" font-size="12" fill="#5A6E85">失败回退 SSE</text>
    <rect x="1000" y="70" width="240" height="96" rx="12" fill="#FFFFFF" stroke="#8FA6C0" stroke-width="1.5"/>
    <text x="1120" y="108" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A5F">远程 MCP 服务</text>
    <text x="1120" y="132" text-anchor="middle" font-size="13" fill="#5A6E85">Spring AI 上游</text>
    <line x1="640" y1="166" x2="640" y2="218" stroke="#2B9FC7" stroke-width="2" marker-end="url(#ar2)"/>
    <text x="668" y="198" font-size="12" fill="#2B6E92">原生文件 I/O 落盘</text>
    <rect x="520" y="224" width="240" height="70" rx="12" fill="#FFFFFF" stroke="#2B9FC7" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="640" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#0F5E87">本地数据文件 dataDir</text>
    <text x="640" y="276" text-anchor="middle" font-size="12" fill="#4A7A99">instanceId / raw json / blocks</text>
  </g>
  <g>
    <rect x="40" y="330" width="580" height="330" rx="14" fill="#F2FAF5" stroke="#3E9B6F" stroke-width="1.5"/>
    <text x="60" y="368" font-size="18" font-weight="700" fill="#2E7D57">代理只做（透传 + 落盘）</text>
    <circle cx="72" cy="398" r="5" fill="#3E9B6F"/>
    <text x="88" y="403" font-size="14" fill="#33503F">tools/list 与直连逐字段一致 —— drop-in 替代</text>
    <circle cx="72" cy="436" r="5" fill="#3E9B6F"/>
    <text x="88" y="441" font-size="14" fill="#33503F">CallToolResult 原样落盘，返回 file 路径 + 元信息</text>
    <circle cx="72" cy="474" r="5" fill="#3E9B6F"/>
    <text x="88" y="479" font-size="14" fill="#33503F">静态请求头注入（不接管 OAuth 流程）</text>
    <circle cx="72" cy="512" r="5" fill="#3E9B6F"/>
    <text x="88" y="517" font-size="14" fill="#33503F">连接失败回退 SSE</text>
    <circle cx="72" cy="550" r="5" fill="#3E9B6F"/>
    <text x="88" y="555" font-size="14" fill="#33503F">retain-days 惰性清理（可选，默认永久保留）</text>
    <circle cx="72" cy="588" r="5" fill="#3E9B6F"/>
    <text x="88" y="593" font-size="14" fill="#33503F">主数据文件无损：不脱敏、不截断、不重排</text>
    <circle cx="72" cy="626" r="5" fill="#3E9B6F"/>
    <text x="88" y="631" font-size="14" fill="#33503F">返回单个 text 块（路径 + 元信息）· isError:false</text>
  </g>
  <g>
    <rect x="660" y="330" width="580" height="330" rx="14" fill="#FBF4F3" stroke="#C0564F" stroke-width="1.5"/>
    <text x="680" y="368" font-size="18" font-weight="700" fill="#9A3E38">代理不做（边界）</text>
    <circle cx="692" cy="398" r="5" fill="#C0564F"/>
    <text x="708" y="403" font-size="14" fill="#4A403E">resources / prompts —— 只代理 tools</text>
    <circle cx="692" cy="436" r="5" fill="#C0564F"/>
    <text x="708" y="441" font-size="14" fill="#4A403E">多远程聚合（1 实例 = 1 上游）</text>
    <circle cx="692" cy="474" r="5" fill="#C0564F"/>
    <text x="708" y="479" font-size="14" fill="#4A403E">数据转换 / 清洗 / 格式改写（结果原样落盘）</text>
    <circle cx="692" cy="512" r="5" fill="#C0564F"/>
    <text x="708" y="517" font-size="14" fill="#4A403E">响应缓存</text>
    <circle cx="692" cy="550" r="5" fill="#C0564F"/>
    <text x="708" y="555" font-size="14" fill="#4A403E">OAuth 流程（只做静态请求头注入）</text>
    <circle cx="692" cy="588" r="5" fill="#C0564F"/>
    <text x="708" y="593" font-size="14" fill="#4A403E">后台清理服务（只留 retain-days 参数）</text>
    <circle cx="692" cy="626" r="5" fill="#C0564F"/>
    <text x="708" y="631" font-size="14" fill="#4A403E">数据文件的消费侧读取约定（那是 skill 层的事）</text>
  </g>
  <g>
    <rect x="40" y="688" width="1200" height="58" rx="12" fill="#FFF7EC" stroke="#E8A33D" stroke-width="1.5"/>
    <text x="60" y="712" font-size="15" font-weight="700" fill="#7A4A12">推翻 1:1 决定的条件</text>
    <text x="60" y="734" font-size="14" fill="#5A4630">上游 &gt; 10 ｜ 需要统一命名空间 ｜ 跨上游调用链编排 ｜ 内存被严格限制 —— 把"什么条件下改回去"写下来，比决策本身更有用</text>
  </g>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1E3A5F"/></marker>
    <marker id="ar2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2B9FC7"/></marker>
  </defs>
</svg>
